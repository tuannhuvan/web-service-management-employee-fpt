# Cấu hình Kết nối Web Service SOAP cho Web Client
# Mặc định kết nối tới hrm-service-backend trên GlassFish / Tomcat (cổng 8080)
# Hoặc Standalone WebServicePublisher (cổng 8080)

ws.endpoint.url=http://localhost:8080/hrm-service-backend/EmployeeWebService
ws.wsdl.url=http://localhost:8080/hrm-service-backend/EmployeeWebService?wsdl

# Cấu hình dự phòng nếu deploy dưới tên HRMWebService hoặc Standalone
ws.endpoint.url.fallback=http://localhost:8080/HRMWebService/EmployeeService
